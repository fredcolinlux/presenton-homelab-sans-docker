# Reverse proxy ComfyUI pour Presenton (Debian 13, machine Presenton).
# A installer :
#   sudo cp nginx-comfyui-upstream.conf /etc/nginx/sites-available/comfyui-presenton
#   # Remplacer IP_5070TI et IP_3070TI (IP fixes ou reservations DHCP).
#   sudo ln -sfn /etc/nginx/sites-available/comfyui-presenton /etc/nginx/sites-enabled/comfyui-presenton
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pourquoi backup actif/passif, et pas de least_conn / round-robin :
# Presenton n'a qu'une seule COMFYUI_URL. Il enchaine POST /prompt, puis
# GET /history/{prompt_id}, puis GET /view sur la MEME instance. L'historique
# et les fichiers de sortie sont locaux a chaque ComfyUI. Un load-balancing
# enverrait /history vers l'autre GPU (404 / attente infinie).
# ip_hash ne servirait a rien non plus : Presenton est un seul client, toutes
# les requetes resteraient collees au meme backend, le second GPU ne serait
# jamais utilise.
# Le drapeau « backup » n'envoie le trafic vers la 3070 Ti que si la 5070 Ti
# est injoignable (echec de connexion / max_fails).

upstream comfyui_presenton {
  server IP_5070TI:8188 max_fails=2 fail_timeout=15s;
  server IP_3070TI:8188 backup;
}

server {
  # Accessible seulement depuis la machine Presenton (FastAPI en 127.0.0.1).
  listen 127.0.0.1:8188;
  listen [::1]:8188;
  server_name _;

  client_max_body_size 100M;

  location / {
    proxy_pass http://comfyui_presenton;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Presenton poll /history jusqu'a 3000 s (defaut du code).
    proxy_connect_timeout 10s;
    proxy_send_timeout 3100s;
    proxy_read_timeout 3100s;
  }
}
