# Site nginx Presenton pour Debian 13
# Copier vers /etc/nginx/sites-available/presenton puis :
#   ln -s /etc/nginx/sites-available/presenton /etc/nginx/sites-enabled/presenton
#   rm -f /etc/nginx/sites-enabled/default   # si le site par défaut entre en conflit
#   nginx -t && systemctl reload nginx
#
# Écoute par défaut sur le port 5001 (comme le mapping Docker officiel 5001:80)
# pour ne pas occuper le port 80 s'il sert déjà. Passer à « listen 80; » ou placer
# ce serveur derrière un autre proxy (NPM, Caddy, Traefik) si besoin.
#
# Adapter PRESENTON_ROOT (/opt/presenton) et APP_DATA (/var/lib/presenton/app_data).
# Les slashs finaux des alias sont importants (évite une lecture de fichiers hors cible).

server {
  listen 5001;
  listen [::]:5001;
  server_name _;

  client_max_body_size 100M;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $http_host conserve le port (ex. 5001) ; $host le retire et casse les redirections Next.js
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
    proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
    proxy_read_timeout 30m;
    proxy_connect_timeout 30m;
  }

  location /api/v1/ {
    client_max_body_size 110M;
    error_page 413 = @request_entity_too_large;
    proxy_pass http://127.0.0.1:8000;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
    proxy_connect_timeout 30m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
    proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
  }

  location /api/v2/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
    proxy_connect_timeout 30m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
    proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
  }

  location @request_entity_too_large {
    default_type application/json;
    return 413 '{"detail":"File size must be less than 100MB."}';
  }

  # FastMCP contrôle lui-même le jeton Bearer. Host interne = localhost:8001 (allowlist).
  location /mcp/ {
    client_max_body_size 145M;
    proxy_pass http://127.0.0.1:8001/mcp/;
    proxy_read_timeout 30m;
    proxy_connect_timeout 30m;
    proxy_set_header Host localhost:8001;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
    proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
  }

  location /mcp {
    client_max_body_size 145M;
    proxy_pass http://127.0.0.1:8001/mcp;
    proxy_read_timeout 30m;
    proxy_connect_timeout 30m;
    proxy_set_header Host localhost:8001;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
    proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
  }

  location /docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_read_timeout 30m;
    proxy_connect_timeout 30m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
    proxy_read_timeout 30m;
    proxy_connect_timeout 30m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /_auth_check {
    internal;
    proxy_pass http://127.0.0.1:8000/api/v1/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }

  # Assets empaquetés, sans données utilisateur. Le slash final est obligatoire.
  location /static/ {
    alias /opt/presenton/servers/fastapi/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /app_data/images/ {
    auth_request /_auth_check;
    alias /var/lib/presenton/app_data/images/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }

  location /app_data/exports/ {
    auth_request /_auth_check;
    alias /var/lib/presenton/app_data/exports/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }

  location /app_data/uploads/ {
    auth_request /_auth_check;
    alias /var/lib/presenton/app_data/uploads/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }

  location /app_data/fonts/ {
    alias /var/lib/presenton/app_data/fonts/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }

  location /app_data/templates/ {
    alias /var/lib/presenton/app_data/templates/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }

  location /app_data/pptx-to-html/ {
    auth_request /_auth_check;
    alias /var/lib/presenton/app_data/pptx-to-html/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }

  location /app_data/pptx-to-json/ {
    auth_request /_auth_check;
    alias /var/lib/presenton/app_data/pptx-to-json/;
    disable_symlinks on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000";
  }
}
