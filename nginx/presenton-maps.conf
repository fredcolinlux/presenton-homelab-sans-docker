# À placer dans /etc/nginx/conf.d/presenton-maps.conf
# (inclus automatiquement depuis le contexte http de nginx Debian).
# Conserve le schéma / hôte vus par le navigateur quand un proxy externe est devant Presenton.

map $http_x_forwarded_proto $presenton_forwarded_proto {
  "" $scheme;
  default $http_x_forwarded_proto;
}
map $http_x_forwarded_host $presenton_forwarded_host {
  "" $http_host;
  default $http_x_forwarded_host;
}
